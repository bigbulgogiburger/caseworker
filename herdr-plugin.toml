# caseworker — Herdr 플러그인 매니페스트.
# 설치: herdr plugin install bigbulgogiburger/caseworker   (개발: herdr plugin link <이 디렉터리>)
# 같은 저장소가 Claude Code 플러그인(.claude-plugin/)이자 Herdr 플러그인(이 파일)이다 — 스크립트는 하나(scripts/)를 같이 쓴다.
# 모든 명령은 argv 배열이고 플러그인 루트에서 실행된다. Herdr 밖·하네스 밖에서는 스크립트가 스스로 무동작한다.
id = "bigbulgogiburger.caseworker"
name = "caseworker"
version = "0.3.0"
min_herdr_version = "0.9.0"
platforms = ["windows", "macos", "linux"]

# ── 팝업 pane: 사람이 보는 화면 ────────────────────────────────────────────
[[panes]]
id = "status"
title = "caseworker · 현재 이슈"
placement = "popup"
width = "80%"
height = "70%"
command = ["node", "scripts/herdr-plugin.mjs", "status"]

[[panes]]
id = "gate-commit"
title = "caseworker · 경량 게이트(--commit)"
placement = "popup"
width = "90%"
height = "80%"
command = ["node", "scripts/herdr-plugin.mjs", "gate", "commit"]

[[panes]]
id = "gate-full"
title = "caseworker · 전량 게이트(--full)"
placement = "popup"
width = "90%"
height = "80%"
command = ["node", "scripts/herdr-plugin.mjs", "gate", "full"]

[[panes]]
id = "loop-status"
title = "caseworker · 루프 현황"
placement = "popup"
width = "80%"
height = "60%"
command = ["node", "scripts/herdr-plugin.mjs", "loop-status"]

[[panes]]
id = "new-case"
title = "caseworker · 새 이슈"
placement = "popup"
width = "80%"
height = "50%"
command = ["node", "scripts/herdr-plugin.mjs", "new"]

# ── 액션: 화면 없이 실행 ──────────────────────────────────────────────────
[[actions]]
id = "report"
title = "caseworker: 사이드바 상태 갱신"
contexts = ["workspace"]
command = ["node", "scripts/herdr-plugin.mjs", "report"]

[[actions]]
id = "adopt-branch"
title = "caseworker: 현재 브랜치를 이슈로 채택"
contexts = ["workspace"]
command = ["node", "scripts/herdr-plugin.mjs", "adopt"]

# ── 이벤트: worktree 가 생기면 브랜치 이름에서 이슈 키를 읽어 상태 JSON 을 만든다 ──
[[events]]
on = "worktree.created"
command = ["node", "scripts/herdr-plugin.mjs", "on-worktree-created"]
